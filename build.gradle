allprojects {
    group = 'com.agentengine'
    version = '1.0.1-SNAPSHOT'
}

subprojects {
    repositories {
        mavenCentral()
    }
}

// Git hooks installation task
tasks.register('installGitHooks', Copy) {
    description = 'Installs git hooks from gradle/git-hooks/ to .git/hooks/'
    group = 'git'
    
    from file('gradle/git-hooks')
    into file('.git/hooks')
    filePermissions { unix(0755) }
    
    doLast {
        println '✅ Git hooks installed successfully'
    }
}

// Auto-install hooks when any subproject builds
subprojects {
    afterEvaluate {
        tasks.matching { it.name == 'build' }.configureEach {
            dependsOn rootProject.tasks.named('installGitHooks')
        }
    }
}

tasks.register('cleanupOldPackages', Exec) {
    description = 'Cleans up old packages via GitHub CLI'
    group = 'publishing'
    workingDir = rootProject.projectDir
    
    def ghToken = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: ""
    def ghUser = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: "hunter1703"
    
    if (ghToken) {
        environment 'GH_TOKEN', ghToken
    }
    environment 'ORG', ghUser
    
    commandLine './cleanup_packages.sh'
}

subprojects {
    plugins.withId('maven-publish') {
        tasks.named('publish').configure {
            finalizedBy rootProject.tasks.named('cleanupOldPackages')
        }
    }
}
