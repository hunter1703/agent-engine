import org.gradle.api.file.RelativePath

allprojects {
    group = 'com.agentengine'
}

subprojects {
    repositories {
        mavenCentral()
    }
    apply plugin: 'com.agentengine.java-base-conventions'
}

final def coreModules = [
    ':engine',
    ':engine:client',
    ':interfaces:common',
    ':interfaces:rest'
]

tasks.register('build') {
    dependsOn coreModules.collect { module -> "${module}:build" }
}

tasks.register('test') {
    dependsOn coreModules.collect { module -> "${module}:test" }
}

tasks.register('restDev') {
    dependsOn ':interfaces:rest:quarkusDev'
}

final def pluginDirs = file('plugins').listFiles()?.findAll { pluginDir ->
    pluginDir.directory && new File(pluginDir, 'build.gradle').exists()
} ?: []

final def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
final def gradleWrapper = new File(rootDir, isWindows ? 'gradlew.bat' : 'gradlew').absolutePath

final def pluginBuildTasks = pluginDirs.collect { pluginDir ->
    final def suffix = pluginDir.name
        .split('[^A-Za-z0-9]+')
        .findAll { it }
        .collect { it.capitalize() }
        .join('')
    tasks.register("buildPlugin${suffix}", Exec) {
        commandLine gradleWrapper, '-p', pluginDir.absolutePath, 'clean', 'build'
    }
}

tasks.register('syncPlugins', Copy) {
    dependsOn ':engine:jar'
    dependsOn pluginBuildTasks
    from('plugins') {
        include '**/build/libs/*-plugin.jar'
        eachFile { fileCopyDetails ->
            fileCopyDetails.relativePath = new RelativePath(true, fileCopyDetails.name)
        }
        includeEmptyDirs = false
    }
    into('plugins')
}
