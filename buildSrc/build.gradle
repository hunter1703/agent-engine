plugins {
    id 'java'
    id 'java-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation libs.spotless.gradle.plugin
    implementation libs.jandex.gradle.plugin
    implementation group: 'io.quarkus', name: 'gradle-application-plugin', version: libs.versions.quarkus.get()
    implementation group: 'io.quarkus.extension', name: 'gradle-extension-plugin', version: libs.versions.quarkus.get()
    // functionaljava must be on the buildscript classpath so spotless's FeatureClassLoader
    // can resolve it when running palantir-java-format (declared 'runtime' scope in its POM,
    // so Spotless's dependency resolver does not pull it in automatically).
    implementation 'org.functionaljava:functionaljava:5.0'
}

gradlePlugin {
    plugins {
        javaLibraryConventions {
            id = 'com.agentengine.java-library-conventions'
            implementationClass = 'com.agentengine.conventions.JavaLibraryConventionsPlugin'
        }
        javaApplicationConventions {
            id = 'com.agentengine.java-application-conventions'
            implementationClass = 'com.agentengine.conventions.JavaApplicationConventionsPlugin'
        }
    }
}
