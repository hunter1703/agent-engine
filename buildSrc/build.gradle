plugins {
    id 'java'
    id 'java-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "com.diffplug.spotless:spotless-plugin-gradle:${libs.versions.spotless.get()}"
    implementation "org.kordamp.gradle:jandex-gradle-plugin:${libs.versions.jandex.get()}"
}

gradlePlugin {
    plugins {
        javaLibraryConventions {
            id = 'com.agentengine.java-library-conventions'
            implementationClass = 'com.agentengine.conventions.JavaLibraryConventionsPlugin'
        }
        javaApplicationConventions {
            id = 'com.agentengine.java-application-conventions'
            implementationClass = 'com.agentengine.conventions.JavaApplicationConventionsPlugin'
        }
    }
}
