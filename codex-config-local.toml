# Codex CLI Configuration for Local Agent Engine

# Define the Agent Engine as a model provider
[model_providers.agent-engine-local]
name = "Local Agent Engine"
base_url = "http://localhost:8080"
# No authentication needed for local dev, but you can add if required
# env_key = "AGENT_ENGINE_API_KEY"

# Headers to send with each request to the Agent Engine
[model_providers.agent-engine-local.http_headers]
# Content-Type is typically set automatically, but you can specify if needed
# Accept = "text/event-stream"

# Configure the model to use the local Agent Engine provider
[models."agent-engine-local-model"]
name = "Local Agent Engine Model"
provider = "agent-engine-local"

# Configure the responses API endpoint specifically
[models."agent-engine-local-model".responses]
# Enable response streaming
stream = true
# Set response timeout if needed
timeout_seconds = 300

# Optional: Set up a profile for the local Agent Engine integration
[profiles.local-agent-engine]
model = "agent-engine-local-model"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "medium"

# To use this profile, run: codex --profile local-agent-engine