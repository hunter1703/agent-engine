{{- $probes := include "agent-engine.infra-base.probes" . | fromYaml -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.service.name }}
  namespace: {{ include "agent-engine.infra-base.namespace" . }}
  labels:
    {{- include "agent-engine.infra-base.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.name }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent-engine.infra-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-engine.infra-base.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "agent-engine.infra-base.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "agent-engine.infra-base.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: mongo
              containerPort: 27017
          startupProbe:
            tcpSocket:
              port: mongo
            periodSeconds: {{ $probes.startup.periodSeconds }}
            failureThreshold: {{ $probes.startup.failureThreshold }}
            timeoutSeconds: {{ $probes.startup.timeoutSeconds }}
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: {{ $probes.readiness.periodSeconds }}
            failureThreshold: {{ $probes.readiness.failureThreshold }}
            timeoutSeconds: {{ $probes.readiness.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: {{ $probes.liveness.periodSeconds }}
            failureThreshold: {{ $probes.liveness.failureThreshold }}
            timeoutSeconds: {{ $probes.liveness.timeoutSeconds }}
          resources:
            {{- toYaml (required "resources must be set" .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ required "persistence.size must be set" .Values.persistence.size }}
