app-base:
  tier: local
  minReadySeconds: 0
  preStopSleepSeconds: 0
  terminationGracePeriodSeconds: 10
  replicas: 2
  resources:
    requests:
      cpu: "250m"
      memory: "750Mi"
    limits:
      cpu: "250m"
      memory: "750Mi"
  config:
    applicationProperties:
      quarkus.otel.service.name: agent-engine-agent
      # Disabled: no OTel collector deployed. Remove and set quarkus.otel.exporter.otlp.endpoint when one is available.
      quarkus.otel.sdk.disabled: "true"
      quarkus.grpc.server.use-separate-server: "false"
      agent-engine.session-actor.passivation.idle-timeout-seconds: "3600"
      # gRPC server configuration - increase message size limit to 100MB
      quarkus.grpc.server.max-inbound-message-size: "104857600"
      quarkus.shutdown.timeout: 5S
      pekko.coordinated-shutdown.phases.cluster-sharding-shutdown-region.timeout: 5s
      pekko.coordinated-shutdown.phases.cluster-leave.timeout: 5s
      pekko.coordinated-shutdown.phases.actor-system-terminate.timeout: 5s
