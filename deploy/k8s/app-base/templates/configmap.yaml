apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-engine.app-base.applicationPropertiesConfigMapName" . }}
  namespace: {{ include "agent-engine.app-base.namespace" . }}
  labels:
    {{- include "agent-engine.app-base.labels" . | nindent 4 }}
data:
  application.properties: |-
    {{- $config := .Values.config | default dict }}
    {{- if include "agent-engine.app-base.pekkoEnabled" . }}
    pekko.cluster.roles={{ .Values.pekko.cluster }}
    {{- end }}
    {{- range $key, $value := $config.applicationProperties }}
    {{ $key }}={{ $value }}
    {{- end }}
