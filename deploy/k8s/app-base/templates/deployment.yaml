apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-engine.app-base.instance" . }}
  namespace: {{ include "agent-engine.app-base.namespace" . }}
  labels:
    {{- include "agent-engine.app-base.labels" . | nindent 4 }}
spec:
  replicas: {{ required "replicas must be set" .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "agent-engine.app-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-engine.app-base.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/application-properties: {{ (.Values.config | default dict).applicationProperties | toYaml | sha256sum }}
        {{- with (.Values.global | default dict).rolloutRevision }}
        rolloutRevision: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agent-engine.app-base.instance" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.service.name }}
          image: {{ include "agent-engine.app-base.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.httpPort | quote }}
            - name: QUARKUS_GRPC_SERVER_PORT
              value: {{ .Values.service.grpcPort | quote }}
            - name: QUARKUS_CONFIG_LOCATIONS
              value: file:/config/application.properties
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- $java := .Values.java | default dict }}
            {{- if $java.opts }}
            - name: JAVA_OPTS
              value: {{ $java.opts | quote }}
            {{- end }}
            {{- if $java.args }}
            - name: JAVA_ARGS
              value: {{ $java.args | quote }}
            {{- end }}
          {{- $secrets := .Values.secrets | default dict }}
          {{- if $secrets.envSecretName }}
          envFrom:
            - secretRef:
                name: {{ $secrets.envSecretName }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            {{- if .Values.service.pekkoPort }}
            - name: pekko
              containerPort: {{ .Values.service.pekkoPort }}
            {{- end }}
            - name: management
              containerPort: 8558
          {{- include "agent-engine.app-base.probes" . | nindent 10 }}
          resources:
            {{- toYaml (required "resources must be set" .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: application-properties
              mountPath: /config/application.properties
              subPath: application.properties
              readOnly: true
            - name: global-properties
              mountPath: /config/global.properties
              subPath: global.properties
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: application-properties
          configMap:
            name: {{ include "agent-engine.app-base.applicationPropertiesConfigMapName" . }}
        - name: global-properties
          configMap:
            name: {{ include "agent-engine.app-base.globalPropertiesConfigMapName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
