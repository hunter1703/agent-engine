namespace: agent-engine
revisionHistoryLimit: 3
minReadySeconds: 20
preStopSleepSeconds: 15
terminationGracePeriodSeconds: 90
pdb:
  enabled: false

tmpVolume:
  sizeLimit: 256Mi

service:
  httpPort: 8080
  grpcPort: 9000
  pekkoPort: 2552
  managementPort: 8558

# Setting pekko.cluster turns on Pekko clustering for this service: the runtime property,
# pod-discovery RBAC, the service account token, the two ports above, and the pod label peers
# use to find each other. Nothing else needs setting. Leave unset (cluster empty) to disable.
pekko: {}

# Same for every service today; an app chart can override app-base.java.* if it ever differs.
java:
  opts: "--enable-preview -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Dfile.encoding=UTF-8"
  args: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=80 -XX:+ExitOnOutOfMemoryError"

ingress:
  enabled: false

image:
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  automountToken: false

rbac:
  rules: []

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

probes:
  readiness:
    path: /q/health/ready
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  startup:
    enabled: true
    path: /q/health
    periodSeconds: 10
    failureThreshold: 45
    timeoutSeconds: 3
