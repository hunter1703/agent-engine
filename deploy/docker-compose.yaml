

services:
  agent-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18080:18080"

    environment:
      - QUARKUS_MONGODB_CONNECTION_STRING=mongodb://mongodb:27017
    depends_on:
      - mongodb
    networks:
      - agent-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27018:27017" # Exposed for local debugging on non-standard port 27018

    volumes:
      - mongodb_data:/data/db
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  mongodb_data:
