# Overrides ../../default.conf for the scheduler cluster's "local" tier specifically —
# see deployae's pekko_actor_conf() priority (cluster/tier > cluster/default > env default).
#
# The local tier runs scheduler at a single replica (deploy/k8s/scheduler/tiers/local/values.yaml),
# with no HA expectation. A lone node can never satisfy the shared default's
# min-nr-of-members = 2 — the leader would never move it from Joining to Up, and neither
# SchedulerActor (singleton) nor JobRunnerActor (sharding) would ever start. Safe to relax to 1
# here specifically because replicas is also 1 here; a tier running more replicas should not
# need this override at all, and staging/prod must keep at least 2 (ideally 3, for the
# split-brain resolver's keep-majority margin).
pekko.cluster.min-nr-of-members = 1
