name: Build and Push Infra Setup Image

on:
  push:
    branches:
      - main
    paths:
      - "deploy/docker/infra-setup/Dockerfile"
      - ".github/workflows/build-infra-setup-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for deployae)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployae
        run: pip install ./deploy/scripts

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push infra setup image
        run: |
          python3 -m deployae buildInfraSetupImage --registry "$REGISTRY"
