# Quarkus Platform Config
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
# quarkusPlatformVersion and others are managed in libs.versions.toml

# Gradle Performance Optimizations
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true

# Disable parallel execution to avoid Quarkus Gradle plugin concurrency issues
org.gradle.parallel=false

# Enable configuration caching (disabled for deployEngine due to Jandex plugin incompatibility)
# org.gradle.configuration-cache=true

# Enable build cache
org.gradle.caching=true

# Enable file watching for incremental builds
org.gradle.vfs.watch=true

# Disable configuration on demand to avoid Quarkus Gradle plugin concurrency issues
org.gradle.configureondemand=false
