plugins {
    id 'java-library'
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:${property('jacksonVersion')}"
    api "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${property('jacksonVersion')}"
    api 'com.alibaba.fastjson2:fastjson2:2.0.48'
    api 'com.hubspot.jinjava:jinjava:2.7.1'

    testImplementation "org.assertj:assertj-core:${property('assertjVersion')}"
    testImplementation "org.junit.jupiter:junit-jupiter:${property('junitVersion')}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
