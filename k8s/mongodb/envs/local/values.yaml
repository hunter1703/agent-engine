# Local Docker Desktop development overlay.
requireExistingSecret: false

auth:
  enabled: true
  username: agentengine
  password: agentengine

persistence:
  enabled: true
  size: 10Gi
  storageClassName: "hostpath"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
