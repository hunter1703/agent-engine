# Headless service required by the MongoDB StatefulSet for pod DNS identity.
# Application pods connect to MongoDB via the regular ClusterIP service (mongodb).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}-headless
  namespace: {{ include "agent-engine.infra-base.namespace" . }}
  labels:
    {{- include "agent-engine.infra-base.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "agent-engine.infra-base.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
