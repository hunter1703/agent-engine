apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-engine-rest.fullname" . }}
  namespace: {{ include "agent-engine-rest.namespace" . }}
  labels:
    {{- include "agent-engine-rest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "agent-engine-rest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-engine-rest.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.config.existingConfigMap }}
        checksum/application-properties: {{ .Values.config.applicationProperties | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agent-engine-rest.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rest
          image: {{ include "agent-engine-rest.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.httpPort | quote }}
            {{- if .Values.bootstrap.mongodb.existingSecret }}
            - name: MONGODB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrap.mongodb.existingSecret }}
                  key: {{ .Values.bootstrap.mongodb.connectionStringKey }}
            {{- end }}
            - name: QUARKUS_CONFIG_LOCATIONS
              value: file:/config/application.properties
            {{- if .Values.java.opts }}
            - name: JAVA_OPTS
              value: {{ .Values.java.opts | quote }}
            {{- end }}
            {{- if .Values.java.args }}
            - name: JAVA_ARGS
              value: {{ .Values.java.args | quote }}
            {{- end }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or .Values.extraEnvFromSecrets .Values.extraEnvFromConfigMaps }}
          envFrom:
            {{- range .Values.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.extraEnvFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: application-properties
              mountPath: /config/application.properties
              subPath: application.properties
              readOnly: true
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: application-properties
          configMap:
            name: {{ include "agent-engine-rest.applicationPropertiesConfigMapName" . }}
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            {{- if .Values.tmpVolume.sizeLimit }}
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
            {{- end }}
        {{- end }}
