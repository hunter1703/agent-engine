{{- if .Values.serviceAccount.create }}
{{- $ctx := dict "root" . "component" .Values.component -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-engine.base.serviceAccountName" $ctx }}
  namespace: {{ include "agent-engine.base.namespace" $ctx }}
  labels:
    {{- include "agent-engine.base.labels" $ctx | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
