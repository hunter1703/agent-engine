component: runtime
replicas: 3
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 150
podManagementPolicy: Parallel

image:
  repository: agent-engine/runtime
  tag: "latest"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

java:
  opts: "--enable-preview -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Dfile.encoding=UTF-8"
  args: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=80 -XX:+ExitOnOutOfMemoryError"

config:
  applicationProperties:
    pekko.cluster.roles: runtime
    quarkus.otel.service.name: agent-engine-runtime
    # Disabled: no OTel collector deployed. Remove and set quarkus.otel.exporter.otlp.endpoint when one is available.
    quarkus.otel.sdk.disabled: "true"
    quarkus.log.console.json: "true"
    agent-engine.session-actor.passivation.idle-timeout: PT1H
    # gRPC server configuration - increase message size limit to 100MB
    quarkus.grpc.server.max-inbound-message-size: "104857600"

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9000
  pekkoPort: 2552
  headlessName: agent-engine-runtime-internal
  publishNotReadyAddresses: true

tmpVolume:
  enabled: true
  sizeLimit: 512Mi


probes:
  readiness:
    path: /q/health/ready
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  startup:
    enabled: true
    path: /q/health/live
    periodSeconds: 10
    failureThreshold: 45
    timeoutSeconds: 3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: runtime

updateStrategy:
  type: RollingUpdate
