namespace: agent-engine
nameOverride: ""
fullnameOverride: ""
replicas: 3
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 150
priorityClassName: ""
podManagementPolicy: Parallel

commonLabels: {}
podLabels: {}
podAnnotations: {}

imagePullSecrets: []

image:
  repository: agent-engine/runtime
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

java:
  opts: "--enable-preview -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Dfile.encoding=UTF-8"
  args: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=80 -XX:+ExitOnOutOfMemoryError"

bootstrap:
  existingSecret: "agent-engine-infra-bootstrap"
  bootstrapPropertiesKey: bootstrap.properties

config:
  existingConfigMap: ""
  applicationProperties:
    quarkus.otel.service.name: agent-engine-runtime
    quarkus.otel.exporter.otlp.endpoint: http://otel-collector:4317
    quarkus.log.console.json: "true"
    agent-engine.session-actor.passivation.idle-timeout: PT1H

extraEnv: {}
extraEnvFromSecrets: []
extraEnvFromConfigMaps: []

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

service:
  type: ClusterIP
  annotations: {}
  httpPort: 8080
  grpcPort: 9000
  pekkoPort: 2552
  headlessName: agent-engine-runtime-internal
  publishNotReadyAddresses: true

tmpVolume:
  enabled: true
  sizeLimit: 512Mi

probes:
  readiness:
    path: /q/health/ready
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  startup:
    enabled: true
    path: /q/health/live
    periodSeconds: 10
    failureThreshold: 45
    timeoutSeconds: 3

# Seconds to sleep in preStop hook before the container receives SIGTERM.
# Gives Kubernetes time to remove the pod from service endpoints and lets
# the old Pekko Artery port (2552) drain before the replacement pod starts.
preStopSleepSeconds: 15

# Seconds a pod must be ready before the StatefulSet considers it available
# and proceeds to the next pod in a rolling update.
minReadySeconds: 20

updateStrategy:
  type: RollingUpdate

pdb:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
