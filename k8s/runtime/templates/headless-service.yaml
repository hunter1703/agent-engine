apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.headlessName }}
  namespace: {{ include "agent-engine-runtime.namespace" . }}
  labels:
    {{- include "agent-engine-runtime.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.service.publishNotReadyAddresses }}
  selector:
    {{- include "agent-engine-runtime.selectorLabels" . | nindent 4 }}
  ports:
    - name: pekko
      port: {{ .Values.service.pekkoPort }}
      targetPort: pekko
