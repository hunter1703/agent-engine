namespace: agent-engine
nameOverride: ""
fullnameOverride: ""

# When true, helm will fail if mongodb.auth.existingSecret or postgres.existingSecret is not set.
# Enable this in production to prevent accidental deployment with auto-generated credentials.
requireExistingSecrets: false

commonLabels: {}
imagePullSecrets: []

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
    digest: ""
    pullPolicy: IfNotPresent
  serviceName: mongodb
  port: 27017
  connectionString: ""
  auth:
    enabled: true
    username: agentengine
    password: agentengine
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  service:
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 6
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 6
      timeoutSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15"
    digest: ""
    pullPolicy: IfNotPresent
  serviceName: postgres
  port: 5432
  jdbcUrl: ""
  database: agent_engine_events
  username: agentengine
  password: agentengine
  existingSecret: ""
  usernameKey: username
  passwordKey: password
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: ""
  service:
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 30
      timeoutSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 6
      timeoutSeconds: 5
    liveness:
      periodSeconds: 20
      failureThreshold: 6
      timeoutSeconds: 5
  nodeSelector: {}
  tolerations: []
  affinity: {}

localstack:
  enabled: true
  image:
    repository: localstack/localstack
    tag: "3"
    pullPolicy: IfNotPresent
  serviceName: localstack
  port: 4566
  services: s3
  region: us-east-1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
