{{- if .Values.localstack.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.localstack.serviceName }}
  namespace: {{ include "agent-engine-infra.namespace" . }}
  labels:
    app.kubernetes.io/name: localstack
    {{- include "agent-engine-infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: localstack
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: gateway
      port: {{ .Values.localstack.port }}
      targetPort: gateway
{{- end }}
