{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.qdrant.serviceName }}
  namespace: {{ include "agent-engine-infra.namespace" . }}
  labels:
    app.kubernetes.io/name: qdrant
    {{- include "agent-engine-infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.qdrant.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.grpcPort }}
      targetPort: grpc
{{- end }}
