{{- $ctx := dict "root" . "component" .Values.component -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.headlessName }}
  namespace: {{ include "agent-engine.base.namespace" $ctx }}
  labels:
    {{- include "agent-engine.base.labels" $ctx | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: {{ .Values.service.publishNotReadyAddresses }}
  selector:
    {{- include "agent-engine.base.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: pekko
      port: {{ .Values.service.pekkoPort }}
      targetPort: pekko
