{{- $ctx := dict "root" . "component" .Values.component -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-engine.base.applicationPropertiesConfigMapName" $ctx }}
  namespace: {{ include "agent-engine.base.namespace" $ctx }}
  labels:
    {{- include "agent-engine.base.labels" $ctx | nindent 4 }}
data:
  application.properties: |-
    {{- range $key, $value := .Values.config.applicationProperties }}
    {{ $key }}={{ $value }}
    {{- end }}
