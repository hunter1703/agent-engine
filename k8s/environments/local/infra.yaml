# Local Docker Desktop development overlay.
# Mirrors production settings for realistic testing.
# Note: Uses 'hostpath' storage class which auto-provisions but has Delete reclaim policy.
# Data persists as long as PVCs are not deleted (cleanup.sh deletes them by default).

requireExistingSecrets: false

mongodb:
  enabled: true
  auth:
    enabled: true
    username: agentengine
    password: agentengine
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "hostpath"

postgres:
  enabled: true
  username: agentengine
  password: agentengine
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: "hostpath"
