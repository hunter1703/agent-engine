replicas: 3
pdb:
  enabled: true
  minAvailable: 2
ingress:
  enabled: false
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: agent-engine-rest
        app.kubernetes.io/instance: agent-engine-rest
