replicas: 2
pdb:
  enabled: true
  minAvailable: 1
bootstrap:
  mongodb:
    existingSecret: agent-engine-infra-mongodb-connection
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: agent-engine-core
        app.kubernetes.io/instance: agent-engine-core
