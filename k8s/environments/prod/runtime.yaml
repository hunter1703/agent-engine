replicas: 3
pdb:
  enabled: true
  minAvailable: 2
bootstrap:
  mongodb:
    existingSecret: agent-engine-infra-mongodb-connection
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: agent-engine-runtime
        app.kubernetes.io/instance: agent-engine-runtime
