namespace: agent-engine

image:
  repository: postgres
  tag: "15"
  digest: ""
  pullPolicy: IfNotPresent

serviceName: postgres
port: 5432
database: agent_engine_events

auth:
  username: agentengine
  password: agentengine
  secretName: "postgres-auth"
  existingSecret: ""
  usernameKey: username
  passwordKey: password

requireExistingSecret: false

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""

service:
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 5
  readiness:
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5
  liveness:
    periodSeconds: 20
    failureThreshold: 6
    timeoutSeconds: 5

imagePullSecrets: []
commonLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
