{{- $ctx := dict "root" . "component" .Values.component -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-engine.base.fullname" $ctx }}
  namespace: {{ include "agent-engine.base.namespace" $ctx }}
  labels:
    {{- include "agent-engine.base.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds | default 20 }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "agent-engine.base.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-engine.base.selectorLabels" $ctx | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/application-properties: {{ .Values.config.applicationProperties | toYaml | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agent-engine.base.serviceAccountName" $ctx }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: knowledge
          image: {{ include "agent-engine.base.image" $ctx | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.preStopSleepSeconds | default 15 }}"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: QUARKUS_HTTP_PORT
              value: {{ .Values.service.httpPort | quote }}
            - name: QUARKUS_GRPC_SERVER_PORT
              value: {{ .Values.service.grpcPort | quote }}
            - name: QUARKUS_CONFIG_LOCATIONS
              value: file:/config/application.properties
            {{- if .Values.java.opts }}
            - name: JAVA_OPTS
              value: {{ .Values.java.opts | quote }}
            {{- end }}
            {{- if .Values.java.args }}
            - name: JAVA_ARGS
              value: {{ .Values.java.args | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | default "/q/health/ready" }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | default "/q/health/live" }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path | default "/q/health" }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: application-properties
              mountPath: /config/application.properties
              subPath: application.properties
              readOnly: true
            - name: global-properties
              mountPath: /config/global.properties
              subPath: global.properties
              readOnly: true
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: application-properties
          configMap:
            name: {{ include "agent-engine.base.applicationPropertiesConfigMapName" $ctx }}
        - name: global-properties
          configMap:
            name: global-properties-agent-engine-configmap
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            {{- if .Values.tmpVolume.sizeLimit }}
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
            {{- end }}
        {{- end }}
