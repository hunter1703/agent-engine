namespace: agent-engine
nameOverride: ""
fullnameOverride: ""
component: core
replicas: 1
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 90
priorityClassName: ""

commonLabels: {}
podLabels: {}
podAnnotations: {}

imagePullSecrets: []

image:
  repository: agent-engine/core
  tag: "latest"
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountToken: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

java:
  opts: "--enable-preview -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Dfile.encoding=UTF-8"
  args: "-XX:InitialRAMPercentage=50 -XX:MaxRAMPercentage=80 -XX:+ExitOnOutOfMemoryError"

applicationConfig:
  globalConfigMapName: "global-properties-agent-engine-configmap"
  localProperties:
    pekko.cluster.roles: core

config:
  existingConfigMap: ""
  applicationProperties:
    quarkus.otel.service.name: agent-engine-core
    quarkus.otel.exporter.otlp.endpoint: http://otel-collector:4317
    quarkus.log.console.json: "true"

extraEnv: {}
extraEnvFromSecrets: []
extraEnvFromConfigMaps: []

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

service:
  type: ClusterIP
  annotations: {}
  httpPort: 8080
  grpcPort: 9000

tmpVolume:
  enabled: true
  sizeLimit: 256Mi

probes:
  readiness:
    path: /q/health/ready
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  startup:
    enabled: true
    path: /q/health/live
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 3

# Seconds to sleep in preStop hook before SIGTERM — lets Pekko port drain.
preStopSleepSeconds: 15

# Seconds a pod must be ready before the Deployment proceeds to the next replacement.
minReadySeconds: 20

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

pdb:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
