{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-engine-core.fullname" . }}-application-properties-configmap
  namespace: {{ include "agent-engine-core.namespace" . }}
  labels:
    {{- include "agent-engine-core.labels" . | nindent 4 }}
data:
  application.properties: |-
    {{- range $key, $value := .Values.config.applicationProperties }}
    {{ $key }}={{ $value }}
    {{- end }}
{{- end }}
