plugins {
    id 'jacoco'
    id 'com.agentengine.java-library-conventions'
    alias(libs.plugins.quarkus)
}

dependencies {
    implementation(enforcedPlatform(libs.quarkus.bom))
    implementation platform(libs.quarkus.langchain4j.bom)
    implementation platform(libs.langchain4j.bom)
    implementation libs.quarkus.langchain4j.core
    implementation project(':commons')
    implementation project(':engine:api')
    implementation libs.langchain4j.core
    implementation libs.langchain4j.open.ai
    implementation libs.langchain4j.ollama
    implementation libs.quarkus.mongodb.client

    testImplementation libs.quarkus.junit5
    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.jacocoTestCoverageVerification {
    dependsOn tasks.test
    violationRules {
        rule {
            limit {
                minimum = 0.85
            }
        }
    }
}

tasks.test {
    finalizedBy tasks.jacocoTestReport, tasks.jacocoTestCoverageVerification
}

tasks.check {
    dependsOn tasks.jacocoTestCoverageVerification
}

tasks.register('validateModelConfig', JavaExec) {
    group = 'verification'
    description = 'Validate a model config JSON/YAML file.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.agentengine.engine.model.ModelConfigValidator'
}
