plugins {
    id 'com.agentengine.java-library-conventions'
    alias(libs.plugins.protobuf)
}

dependencies {
    api libs.mongodb.bson
    api libs.google.adk.core
    api libs.microprofile.openapi.api
    api libs.json.path
    api libs.grpc.protobuf
    api libs.grpc.stub
    api libs.protobuf.java
    api libs.annotations.api
    api libs.jakarta.inject.api
    api libs.jakarta.enterprise.cdi.api

    implementation(enforcedPlatform(libs.quarkus.bom))
    implementation libs.quarkus.arc
    implementation libs.jakarta.validation.api
    implementation libs.jackson.databind
    implementation libs.jackson.dataformat.yaml
    implementation libs.jinjava
    implementation libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}
