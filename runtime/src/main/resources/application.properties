# OTel — disabled in tests; endpoint and service-name come from k8s ConfigMap
%test.quarkus.otel.sdk.disabled=true

# Session actor idle passivation timeout (ISO-8601 duration, e.g. PT30M, PT1H)
agent-engine.session-actor.passivation.idle-timeout=PT1H

# Console log format for local development (overridden by JSON logging in k8s)
%dev.quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{3.}] (%t) [%X{traceId}] %s%e%n
pekko.serialization.modules=com.agentengine.runtime.serializers.PekkoJacksonModule
