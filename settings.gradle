plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'agent-engine'

include 'runtime'
project(':runtime').projectDir = file('runtime')

include 'runtime-api'
project(':runtime-api').projectDir = file('runtime/api')

include 'core-api'
project(':core-api').projectDir = file('core/api')

include 'core'
project(':core').projectDir = file('core')

include 'connectors:core'
project(':connectors:core').projectDir = file('connectors/core')

include 'interfaces:rest'
project(':interfaces:rest').projectDir = file('interfaces/rest')

include 'util:common'
project(':util:common').projectDir = file('util/common')

include 'util:mongodb'
project(':util:mongodb').projectDir = file('util/mongodb')

include 'util:ms'
project(':util:ms').projectDir = file('util/ms')

include 'util:agents'
project(':util:agents').projectDir = file('util/agents')

include 'util:pekko'
project(':util:pekko').projectDir = file('util/pekko')