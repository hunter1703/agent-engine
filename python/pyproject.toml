[project]
name = "agent-engine-python"
version = "0.1.0"
description = "Python services and integrations for agent-engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "requests>=2.31.0",
    "mitmproxy>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model"]

