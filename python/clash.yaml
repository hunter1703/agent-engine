# Clash profile for the iPhone. The domains listed under `rules` go through a proxy running on the
# Mac (port 9000), and everything else goes straight to the internet.
#
# Import it into the Clash app on the phone. The Mac is found by its local network name
# (r2d2.local), so it works on any network the phone and the Mac share, whatever address the Mac
# has there. When the name does not answer, the traffic goes direct, so the phone keeps working
# with the Mac switched off.
#
# Clash sends its own connections over the phone's internet connection (Wi-Fi or cellular). When
# the Mac is on the phone's Personal Hotspot it is only reachable over the hotspot's own interface,
# so a second node reaches the same name over that interface; the group uses the first node that
# works, so each network gets the one that fits it.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - { name: "Mac", type: http, server: r2d2.local, port: 9000 }
  - { name: "Mac-hotspot", type: http, server: r2d2.local, port: 9000, interface-name: bridge100 }

proxy-groups:
  - name: "MITM"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 30
    proxies:
      - "Mac"
      - "Mac-hotspot"
      - DIRECT

rules:
  # The Mac proxy carries TCP only. Apps try HTTP/3 (QUIC, which is UDP) first, and without this
  # rule that UDP matches nothing below and leaves the phone directly, never reaching the Mac.
  # Rejecting it makes the app fall back to HTTP/2 over TCP, which the rules below send to the
  # Mac. The Clash app's own "UDP Fallback" setting adds this same rule.
  - AND,((NETWORK,udp),(DST-PORT,443/80)),REJECT
  # Domains sent through the Mac; add one line per domain.
  - DOMAIN-SUFFIX,pinterest.com,MITM
  - DOMAIN-SUFFIX,pinimg.com,MITM
  # Everything else.
  - MATCH,DIRECT
