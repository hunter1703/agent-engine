# Registers AdkJacksonModule for Pekko CBOR serialization; not set via k8s ConfigMap.
pekko.serialization.modules=com.agentengine.agent.core.serializers.AdkJacksonModuleProvider$AdkJacksonModule,com.agentengine.agent.core.serializers.AdkJacksonModuleProvider$AdkJacksonTypingModule

# Serves health check probes on their own HTTP server/event-loop, isolated from main request traffic, so a probe can't be starved by the same load it's checking.
quarkus.management.enabled=true
