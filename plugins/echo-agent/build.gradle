plugins {
    id 'java-library'
}

group = 'com.agentengine'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation files('../../engine/api/build/libs/api.jar')
    implementation 'com.google.adk:google-adk:0.5.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

final def pluginJarName = 'echo-agent-plugin'

tasks.named('jar') {
    archiveBaseName.set(pluginJarName)
}
