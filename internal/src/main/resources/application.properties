# Every endpoint in this service is internal, so the prefix lives here rather than in each @Path.
# This is a build-time property in Quarkus and cannot come from the k8s ConfigMap.
quarkus.http.root-path=/internal

# Absolute, so it is not resolved against root-path: health must stay at /q/health for the k8s
# probes and the deploy pipeline, which are shared with every other service.
quarkus.http.non-application-root-path=/q
