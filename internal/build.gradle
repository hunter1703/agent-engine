plugins {
    id 'com.agentengine.java-application-conventions'
}

group = 'com.agentengine.internal'

dependencies {
    // Links every service that owns collections so a single deployment can apply all indexes.
    // Pekko stays dormant here: agent and scheduler host actors only where
    // `agent-engine.pekko.enabled` is set, which this service does not set.
    implementation project(':agent:core')
    implementation project(':catalog:core')
    implementation project(':connectors:core')
    implementation project(':knowledge:core')
    implementation project(':scheduler:api')
    implementation project(':scheduler:core')
    implementation project(':util:common')
    implementation project(':util:mongodb')

    implementation platform(libs.quarkus.bom)
    implementation libs.quarkus.arc
    implementation libs.quarkus.logging.json
    implementation libs.quarkus.opentelemetry
    implementation libs.quarkus.rest.jackson
    implementation libs.quarkus.smallrye.health
    implementation libs.slf4j.api
    implementation libs.jakarta.validation.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}
