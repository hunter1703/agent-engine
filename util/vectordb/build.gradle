plugins {
    id 'com.agentengine.java-library-conventions'
    id 'com.agentengine.repackaged-jars'
}

// The Qdrant client jar bundles its own, older copy of grpc.health.v1. It shadows the one
// Quarkus's gRPC server is generated against and breaks the server at startup, so the client is
// used without its grpc/ classes and its own dependencies are declared explicitly.
repackagedJars {
    register('qdrantClient') {
        dependency = libs.qdrant.client
        exclude 'grpc/**'
    }
}

dependencies {
    // The client jar is taken without its own transitive dependencies. Its gRPC and protobuf
    // classes are provided at runtime, at the deployable's versions, by quarkus-grpc.
    compileOnly libs.grpc.stub
    compileOnly libs.grpc.protobuf
    compileOnly libs.protobuf.java
    runtimeOnly libs.grpc.netty.shaded

    implementation project(':util:common')

    implementation project(':util:context')
    api project(':util:infra')
    implementation project(':util:distributed')

    implementation libs.guava
    implementation libs.slf4j.api

    // Annotation-only API: compile-time marker, runtime provided by Quarkus
    compileOnly libs.jakarta.inject.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}
