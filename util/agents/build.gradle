plugins {
    id 'com.agentengine.java-library-conventions'
}

dependencies {
    implementation project(':util:common')
    implementation project(':util:mongodb')

    api libs.ag.ui.core
    implementation libs.kotlinx.serialization.json

    // Exposed in public API (Content, FinishReason in SessionEvent getters)
    api libs.google.genai

    // Annotation-only APIs: compile-time markers, runtime provided by Quarkus
    compileOnly libs.microprofile.openapi.api
    compileOnly libs.jakarta.validation.api
    compileOnly libs.jakarta.enterprise.cdi.api
    // @BsonDiscriminator is annotation-only; no bson types in public method signatures
    compileOnly libs.mongodb.bson

    implementation libs.google.adk
    implementation libs.google.adk.langchain4j
    implementation libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}