plugins {
    id 'com.agentengine.java-library-conventions'
}

dependencies {
    implementation platform(libs.quarkus.bom)

    implementation project(':util:common')
    api project(':util:infra')
    implementation project(':util:distributed')
    implementation libs.guava

    implementation libs.aws.s3

    implementation libs.oci.objectstorage
    implementation libs.oci.common
    implementation libs.oci.common.httpclient.jersey3

    implementation libs.quarkus.arc

    // Annotation-only (@PostConstruct on package-private init()), runtime provided by Quarkus
    compileOnly libs.jakarta.annotation.api

    implementation libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
    testImplementation libs.mockito.junit.jupiter
}
