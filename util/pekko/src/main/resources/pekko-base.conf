# Static Pekko configuration baked into the image.
# Dynamic values (hostname, seed-nodes, JDBC credentials) are overlaid at runtime

pekko {
  actor {
    provider = cluster
    default-dispatcher.executor = virtual-thread-executor

    # Dedicated dispatcher for cluster heartbeat/failure detector
    # Uses platform threads to avoid virtual thread parking delays
    heartbeat-dispatcher {
      type = Dispatcher
      executor = fork-join-executor
      fork-join-executor {
        parallelism-min = 2
        parallelism-factor = 1.0
        parallelism-max = 4
      }
      throughput = 100
    }
  }
  remote.artery {
    canonical {
      hostname = "localhost"
      port     = 2552
    }
    bind {
      hostname = "0.0.0.0"
      port     = 2552
    }
  }
  cluster {
    seed-nodes = []
    failure-detector.heartbeat-message-transport = "pekko.actor.heartbeat-dispatcher"
  }
  actor.serialization-bindings {
    "com.agentengine.util.pekko.PekkoSerializable" = jackson-cbor
  }
  serialization.jackson {
    jackson-modules += "com.fasterxml.jackson.datatype.jsr310.JavaTimeModule"
    jackson-modules += "com.fasterxml.jackson.datatype.jdk8.Jdk8Module"
  }
  persistence {
    journal.plugin        = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }
}

pekko-persistence-jdbc.shared-databases.slick {
  profile = "slick.jdbc.PostgresProfile$"
  db {
    connectionPool = "HikariCP"
    driver = "org.postgresql.Driver"
    queueSize = 10000
    numThreads = 4
    maxConnections = 4
    minConnections = 1
    connectionTimeout = 10000
    validationTimeout = 3000
    idleTimeout = 600000
    maxLifetime = 1800000
    keepAliveConnection = on
  }
}

jdbc-journal.use-shared-db = "slick"
jdbc-snapshot-store.use-shared-db = "slick"
jdbc-read-journal.use-shared-db = "slick"
