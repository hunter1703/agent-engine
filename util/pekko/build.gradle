plugins {
    id 'com.agentengine.java-library-conventions'
}

dependencies {
    // Pekko types appear in public class hierarchy and interface signatures
    api platform(libs.pekko.bom)
    api libs.pekko.actor.typed
    api libs.pekko.persistence.typed
    api libs.pekko.cluster.sharding.typed

    implementation project(':util:common')
    implementation project(':util:mongodb')

    // Internal serialization only, not in public API
    implementation libs.mongodb.bson

    implementation platform(libs.quarkus.bom)
    implementation libs.quarkus.arc
    implementation libs.pekko.persistence.jdbc
    implementation libs.pekko.serialization.jackson
    implementation libs.pekko.streams
    implementation libs.pekko.management.cluster.bootstrap
    implementation libs.pekko.management.cluster.http
    implementation libs.pekko.discovery.kubernetes.api
    implementation libs.rxjava

    testImplementation libs.pekko.testkit
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
}
