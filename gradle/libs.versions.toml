[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }

[versions]
# Core frameworks
quarkus = "3.34.0"
langchain4j = "1.0.1"
langchain4j-plugin = "1.10.0"
google-adk = "0.5.1-SNAPSHOT"
google-genai = "1.44.0"
pekko = "1.1.5"
pekko-persistence-jdbc = "1.2.0"
pekko-projections = "1.1.0"

# Jackson & JSON
jackson = "2.18.6"
json-path = "2.10.0"
jinjava = "2.8.3"

# Testing
junit = "5.13.2"
junit-platform = "1.13.2"
mockito = "5.18.0"
assertj = "3.27.0"
rest-assured = "5.5.5"
hamcrest = "3.0"
testcontainers = "1.20.6"
testcontainers-redis = "2.2.4"

# gRPC & Protobuf
protobuf = "3.25.8"
protobuf-plugin = "0.9.5"
grpc = "1.70.0"

# Utilities
guava = "33.5.0-jre"
groovy = "4.0.28"
rxjava = "3.1.12"
reactive-streams = "1.0.4"
java-diff-utils = "4.16"
stateless4j = "2.6.0"
slf4j = "2.0.17"
commons-text = "1.13.1"

# Database & Drivers
mongodb = "5.6.3"
postgresql = "42.7.7"
vertx = "4.5.25"

# Jakarta & MicroProfile
jakarta-validation = "3.0.2"
jakarta-inject = "2.0.1"
jakarta-cdi = "4.0.1"
jakarta-annotation = "3.0.0"
javax-annotation = "1.3.2"
microprofile-openapi = "4.0.1"

# Other
ag-ui = "0.0.1"
okhttp = "4.12.0"
spotless = "8.4.0"
jandex = "2.3.0"

[libraries]
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }

# BOMs
langchain4j-bom = { group = "dev.langchain4j", name = "langchain4j-bom", version.ref = "langchain4j" }
pekko-bom = { module = "org.apache.pekko:pekko-bom_2.13", version.ref = "pekko" }
quarkus-bom = { group = "io.quarkus", name = "quarkus-bom", version.ref = "quarkus" }

# Pekko
pekko-actor-typed = { module = "org.apache.pekko:pekko-actor-typed_2.13", version.ref = "pekko" }
pekko-cluster-sharding-typed = { module = "org.apache.pekko:pekko-cluster-sharding-typed_2.13", version.ref = "pekko" }
pekko-cluster-typed = { module = "org.apache.pekko:pekko-cluster-typed_2.13", version.ref = "pekko" }
pekko-persistence-jdbc = { module = "org.apache.pekko:pekko-persistence-jdbc_2.13", version.ref = "pekko-persistence-jdbc" }
pekko-persistence-typed = { module = "org.apache.pekko:pekko-persistence-typed_2.13", version.ref = "pekko" }
pekko-serialization-jackson = { module = "org.apache.pekko:pekko-serialization-jackson_2.13", version.ref = "pekko" }
pekko-streams = { module = "org.apache.pekko:pekko-stream_2.13", version.ref = "pekko" }
pekko-streams-typed = { module = "org.apache.pekko:pekko-stream-typed_2.13", version.ref = "pekko" }
pekko-testkit = { module = "org.apache.pekko:pekko-actor-testkit-typed_2.13", version.ref = "pekko" }
pekko-persistence-testkit = { module = "org.apache.pekko:pekko-persistence-testkit_2.13", version.ref = "pekko" }
pekko-projection-core = { module = "org.apache.pekko:pekko-projection-core_2.13", version.ref = "pekko-projections" }
pekko-projection-eventsourced = { module = "org.apache.pekko:pekko-projection-eventsourced_2.13", version.ref = "pekko-projections" }
pekko-projection-jdbc = { module = "org.apache.pekko:pekko-projection-jdbc_2.13", version.ref = "pekko-projections" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# Google AI
google-adk = { group = "com.google.adk", name = "google-adk", version.ref = "google-adk" }
google-adk-langchain4j = { group = "com.google.adk", name = "google-adk-langchain4j", version.ref = "google-adk" }
google-genai = { group = "com.google.genai", name = "google-genai", version.ref = "google-genai" }

# Quarkus & LangChain4j Core
langchain4j-core = { group = "dev.langchain4j", name = "langchain4j" }
langchain4j-open-ai = { group = "dev.langchain4j", name = "langchain4j-open-ai", version.ref = "langchain4j-plugin" }
langchain4j-ollama = { group = "dev.langchain4j", name = "langchain4j-ollama", version.ref = "langchain4j-plugin" }
langchain4j-http-client-jdk = { group = "dev.langchain4j", name = "langchain4j-http-client-jdk" }
quarkus-mongodb-client = { group = "io.quarkus", name = "quarkus-mongodb-client" }
quarkus-logging-json = { group = "io.quarkus", name = "quarkus-logging-json" }
quarkus-rest-jackson = { group = "io.quarkus", name = "quarkus-rest-jackson" }
quarkus-smallrye-openapi = { group = "io.quarkus", name = "quarkus-smallrye-openapi" }
quarkus-grpc = { group = "io.quarkus", name = "quarkus-grpc" }
quarkus-opentelemetry = { group = "io.quarkus", name = "quarkus-opentelemetry" }
quarkus-smallrye-fault-tolerance = { group = "io.quarkus", name = "quarkus-smallrye-fault-tolerance" }
quarkus-jackson = { group = "io.quarkus", name = "quarkus-jackson" }
quarkus-smallrye-health = { group = "io.quarkus", name = "quarkus-smallrye-health" }
quarkus-micrometer-registry-prometheus = { group = "io.quarkus", name = "quarkus-micrometer-registry-prometheus" }
