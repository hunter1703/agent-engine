plugins {
    id 'com.agentengine.java-library-conventions'
}

group = 'com.agentengine.knowledge'

dependencies {
    implementation project(':util:common')
    implementation project(':util:tenancy')
    api project(':util:vectordb')
    implementation project(':util:agents')
    api project(':tenancy:api')
    implementation project(':util:ms:client')
    api project(':util:infra')

    implementation platform(libs.quarkus.bom)
    compileOnly libs.quarkus.arc
    compileOnly libs.jakarta.inject.api
    compileOnly libs.jakarta.enterprise.cdi.api
}

