plugins {
    id 'java'
    id 'application'
    id 'io.quarkus' version '3.22.2'
    id 'com.diffplug.spotless' version '6.25.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation(enforcedPlatform(
        "${property('quarkusPlatformGroupId')}:${property('quarkusPlatformArtifactId')}:${property('quarkusPlatformVersion')}"
    ))
    implementation platform('io.quarkiverse.langchain4j:quarkus-langchain4j-bom:0.26.1')
    implementation project(':engine')
    implementation project(':engine:client')
    implementation 'io.quarkus:quarkus-picocli'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.48'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
}

spotless {
    java {
        googleJavaFormat('1.22.0')
    }
    format('misc') {
        target '*.md', '.gitignore', '*.yml', '*.yaml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

application {
    mainClass = 'com.agentengine.cli.StdioAgentServer'
}

tasks.withType(Test).configureEach {
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
    jvmArgs '--enable-preview'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('--enable-preview')
}

tasks.named('run', JavaExec) {
    jvmArgs '--enable-preview'
}
