quarkus.application.name=ag-ui-protocol-server
quarkus.http.port=8082
quarkus.websocket.dispatch-to-worker=true

# Enable the AG UI protocol server
agui.protocol.enabled=true
agui.protocol.port=8082
agui.protocol.path=/agui/protocol
agui.protocol.max.connections=100

# Logging configuration
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.category."com.agentengine.interfaces.agui".level=DEBUG

# Health check
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.ui.enable=true