plugins {
    id 'com.agentengine.java-application-conventions'
    id 'io.quarkus' version '3.23.0'
}

dependencies {
    implementation(enforcedPlatform(
            "${property('quarkusPlatformGroupId')}:${property('quarkusPlatformArtifactId')}:${property('quarkusPlatformVersion')}"
    ))
    implementation project(':interfaces:common')
    implementation project(':engine')

    // Quarkus extensions
    implementation 'io.quarkus:quarkus-websockets'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-smallrye-health'

    // Jackson for JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    // Testing
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'

    // AG-UI Core components
    implementation 'com.ag-ui:core:0.0.1'

    // AG-UI Server components
    implementation 'com.ag-ui:server:0.0.1'

    // AG-UI JSON utilities
    implementation 'com.ag-ui:json:0.0.1'

    // AG-UI HTTP client (if you need to connect to remote agents)
    implementation 'com.ag-ui:http:0.0.1'
    implementation 'com.ag-ui:ok-http:4.12.0' // Version tied to OkHttp

}