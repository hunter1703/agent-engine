plugins {
    id 'com.agentengine.java-application-conventions'
    alias(libs.plugins.quarkus)
}

configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'ch.qos.logback', module: 'logback-core'
}

dependencies {
    implementation(enforcedPlatform(libs.quarkus.bom))
    implementation libs.slf4j.api
    implementation project(':engine:api')
    implementation project(':interfaces:common')
    implementation libs.quarkus.logging.json
    implementation libs.quarkus.rest.jackson
    implementation libs.quarkus.smallrye.openapi
    implementation libs.quarkus.mongodb.client
    implementation libs.quarkus.smallrye.health
    implementation libs.quarkus.micrometer.registry.prometheus
    implementation libs.quarkus.hibernate.validator
    implementation libs.quarkus.smallrye.fault.tolerance
    implementation libs.quarkus.grpc

    implementation libs.ag.ui.core
    implementation libs.ag.ui.server
    implementation libs.ag.ui.json
    implementation libs.ag.ui.http
    implementation libs.ag.ui.ok.http



    testImplementation project(':engine')
    testImplementation libs.quarkus.junit5
    testImplementation libs.assertj.core
    testImplementation libs.quarkus.junit5
    testImplementation libs.assertj.core
    testImplementation libs.mockito.core
    testImplementation libs.rest.assured
    testImplementation libs.hamcrest
}

def isCiServer = System.getenv("CI_SERVER") != null
def isCi = System.getenv("CI") != null
def isContinuousIntegration = isCiServer || isCi

if (isContinuousIntegration) {
    tasks.withType(JavaCompile) {
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
}

tasks.named('quarkusDev') {
}


tasks.withType(Test).configureEach {
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}
