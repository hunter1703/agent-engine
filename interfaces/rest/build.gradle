plugins {
    id 'com.agentengine.java-application-conventions'
    id 'io.quarkus' version '3.23.0'
}

repositories {
    mavenLocal()
    mavenCentral()
}
dependencies {
    implementation(enforcedPlatform(
        "${property('quarkusPlatformGroupId')}:${property('quarkusPlatformArtifactId')}:${property('quarkusPlatformVersion')}"
    ))
    implementation platform('io.quarkiverse.langchain4j:quarkus-langchain4j-bom:0.26.1')
    implementation project(':engine')
    implementation project(':engine:client')
    implementation project(':interfaces:common')
    implementation project(':commons')
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-mongodb-client'

    // AG-UI Core components
    implementation 'com.ag-ui:core:0.0.1'

    // AG-UI Server components
    implementation 'com.ag-ui:server:0.0.1'

    // AG-UI JSON utilities
    implementation 'com.ag-ui:json:0.0.1'

    // AG-UI HTTP client (if you need to connect to remote agents)
    implementation 'com.ag-ui:http:0.0.1'
    implementation 'com.ag-ui:ok-http:4.12.0' // Version tied to OkHttp

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.mockito:mockito-core'
}

tasks.withType(Test).configureEach {
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}
