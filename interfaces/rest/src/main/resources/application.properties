quarkus.log.level=INFO
quarkus.log.category."com.agentengine".level=DEBUG

# Use external MongoDB instead of Quarkus dev services.
quarkus.mongodb.devservices.enabled=false

# Console JSON
quarkus.log.console.json=true

# File JSON
quarkus.log.file.enable=true
quarkus.log.file.path=logs/agent-engine.log
quarkus.log.file.level=DEBUG
quarkus.log.file.json=true

# Responses API configuration for Codex CLI compatibility
agent.responses-api.enabled=true
agent.responses-api.default-model=gpt-4-compatible
agent.responses-api.include-token-usage=false
agent.responses-api.include-reasoning=true
