quarkus.log.level=INFO

# Use external MongoDB instead of Quarkus dev services.
quarkus.mongodb.devservices.enabled=false

# Ensure Quarkus indexes shared modules for CDI and Mongo discriminators.
quarkus.index-dependency.interfaces-common.group-id=com.agentengine
quarkus.index-dependency.interfaces-common.artifact-id=common
quarkus.index-dependency.engine.group-id=com.agentengine
quarkus.index-dependency.engine.artifact-id=engine
