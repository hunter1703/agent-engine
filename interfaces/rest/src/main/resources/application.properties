# Jandex indexing for external dependencies (ag-ui/core lacks META-INF/beans.xml).
# Coordinates must match gradle/libs.versions.toml's ag-ui-core entry exactly
# (group "com.ag-ui.community", artifact "java-core") — the previous com.ag-ui/core
# values didn't match anything, so this indexing directive was silently a no-op
# (SmallRyeOpenApiProcessor logged "unable to properly register the hierarchy... not in
# the Jandex index" for com.agui.community.core.event.Event at build time).
quarkus.index-dependency.agui.group-id=com.ag-ui.community
quarkus.index-dependency.agui.artifact-id=java-core

# CORS configuration for React frontend
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:3001
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# OpenAPI schema output (build-time)
quarkus.smallrye-openapi.store-schema-directory=build/openapi
quarkus.smallrye-openapi.store-schema-file-name=agent-engine

# Virtual threads
quarkus.virtual-threads.name-prefix=agent-api-vt-
